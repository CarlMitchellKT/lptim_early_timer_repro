# Tickless kernel on the LPTIM1 (LSI, 32 kHz) system timer: 1 tick = 250 us = 8 counts
CONFIG_PM=y
CONFIG_STM32_LPTIM_CLOCK_LSI=y

# USART3 is wired to the ST-LINK virtual COM port on the example boards
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_MAIN_STACK_SIZE=2048
